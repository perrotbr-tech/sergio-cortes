<style>
:root{

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --navy-top:#243152; --navy-bottom:#171f36; } }
:root[data-theme="dark"]{ --navy-top:#243152; --navy-bottom:#171f36; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%;background:var(--navy-bottom)}
body{

}
body::before{ /* línea diagonal de la marca */
  content:"";position:fixed;top:-5%;left:22%;width:1px;height:115%;
  background:var(--line);transform:rotate(-17deg);transform-origin:top;pointer-events:none;
}
main{position:relative;width:100%;max-width:420px;padding:56px 28px 40px;text-align:center}
.photo{

}
.photo img,.photo .mono{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.photo .mono{display:grid;place-items:center;background:#1f2b4e;color:var(--gold);

h1{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:500;

.rule{width:44px;height:2px;background:var(--gold);margin:16px auto 14px;border:0}
.role{color:var(--gold);font-weight:600;font-size:14px;letter-spacing:.3em;margin:0 0 8px}
.areas{color:var(--soft);font-weight:300;font-size:15px;margin:0 0 40px}
.actions{display:grid;gap:14px}
.btn{

  border-radius:16px;text-decoration:none;font-weight:600;font-size:16px;
  transition:transform .12s ease;
}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn svg{width:22px;height:22px;flex:none}
.btn-primary{background:var(--btn);color:var(--btn-text)}
.btn-ghost{border:1.5px solid var(--gold);color:var(--cream)}
.handle{color:var(--soft);font-size:14px;margin:18px 0 0}
.tagline{font-family:"Playfair Display",Georgia,serif;font-style:italic;color:var(--soft);
  font-size:17px;line-height:1.5;margin:40px auto 0;max-width:300px;text-wrap:balance}
.share{margin:28px auto 0;display:inline-flex;align-items:center;gap:8px;background:none;border:0;

.share svg{width:18px;height:18px}
.share:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
